[package]
name = "cyral"
version = "0.1.0"
description = "A local-first AI desktop companion"
authors = ["Cyral"]
edition = "2021"

[lib]
name = "cyral_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["io-util", "net", "time"] }
image = "0.25"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "native-tls", "smtp-transport"] }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
mailparse = "0.16"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Devices_Geolocation",
    "Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }
windows-future = { version = "0.2.1", features = ["std"] }
